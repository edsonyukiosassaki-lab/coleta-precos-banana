name: CEPEA — série semanal de banana

on:
  schedule:
    - cron: '23 12 * * 6'  # sábado 12:23 UTC = 09:23 BRT (CEPEA publica na sexta; folga de 2 dias antes do boletim de segunda)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Coletar tabela do HF Brasil
        run: xvfb-run -a python coletar_cepea_banana.py

      - name: Commitar cotações novas
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cepea_banana_semanal.csv
          if git diff --cached --quiet; then
            echo "Nada novo para commitar."
          else
            git commit -m "Automated update: cotações semanais Hortifruti/Cepea"
            git push
          fi
