name: CEPEA — série semanal de banana

on:
  schedule:
    - cron: '23 12 * * 6'  # sábado 12:23 UTC = 09:23 BRT (CEPEA publica na sexta; folga de 2 dias antes do boletim de segunda)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Coletar tabela do HF Brasil
        run: xvfb-run -a python coletar_cepea_banana.py

      - name: Commitar cotações novas
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cepea_banana_semanal.csv
          if git diff --cached --quiet; then
            echo "Nada novo para commitar."
          else
            git commit -m "Automated update: cotações semanais Hortifruti/Cepea"
            git push
          fi

      - name: Enviar série para o ERP (mercado_precos)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python supabase_upsert.py

      - name: Issue em caso de falha
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create -R "$GITHUB_REPOSITORY" \
            --title "Coleta CEPEA FALHOU ($(date +%d/%m/%Y))" \
            --body "$(printf 'A coleta semanal do Hortifruti/Cepea falhou (o vídeo do boletim NÃO usa este dado — decisão 13/07 — mas a série histórica para de atualizar).\n\n**O que fazer (nesta ordem):**\n1. Actions → **cepea_semanal** → Run workflow (rerodar resolve a maioria).\n2. Se falhar de novo, o site do HF Brasil pode estar fora do ar — espere 1h e rerode.\n3. Persistindo, acione o Claude com o link desta Issue.\n\nLogs: %s/%s/actions/runs/%s' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
