name: Coleta Diária de Preços de Banana

on:
  schedule:
    # Executa todos os dias às 18:00 (horário UTC)
    # Para alterar o horário, mude os números: minuto hora dia mês dia_da_semana
    - cron: '0 18 * * *'
  
  # Permite executar manualmente no GitHub
  workflow_dispatch:

jobs:
  collect_prices:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v3
      
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install mysql-connector-python requests beautifulsoup4
      
      - name: Executar script de coleta
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          python scripts/scrape_prices_prohort_diario.py
      
      - name: Registrar sucesso
        if: success()
        run: echo "✓ Coleta de preços concluída com sucesso!"
      
      - name: Registrar erro
        if: failure()
        run: echo "✗ Erro na coleta de preços. Verifique os logs."
