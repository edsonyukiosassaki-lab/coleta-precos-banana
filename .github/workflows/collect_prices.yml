name: Coleta Automática de Preços

on:
  schedule:
    # Executa todos os dias às 18:00 (UTC -3 = 21:00 UTC)
    - cron: '0 21 * * *'
  
  # Permite executar manualmente
  workflow_dispatch:

jobs:
  collect-prices:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v3
      
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas mysql-connector-python
      
      - name: Executar script de coleta
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: python scripts/scrape_prices_prohort_diario.py
      
      - name: Notificar sucesso
        if: success()
        run: echo "✓ Preços coletados com sucesso às $(date)"
      
      - name: Notificar erro
        if: failure()
        run: echo "✗ Erro na coleta de preços"
