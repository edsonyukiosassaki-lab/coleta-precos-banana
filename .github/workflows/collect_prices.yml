name: Coleta Diária de Preços de Banana

on:
  schedule:
    - cron: '0 18 * * *'    # diária 15:00 BRT
    - cron: '47 7 * * 1'    # segunda 04:47 BRT — 1h30 antes do boletim semanal (09:17 UTC desde 17/08; Reels no ar até 12:00)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  collect_prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # pypdf fixo na versão testada (lê os PDFs do CEASA-RJ e do CEASA-PR) — versão nova pode extrair o texto diferente
      - name: Instalar dependências
        run: pip install requests pypdf==6.14.2

      # 09/11/2026: Agrolink aposentado (site refeito em ~24/10 e termos de uso proíbem robôs).
      # Fontes oficiais: CEASAMINAS (BH, SP, ES + reservas MG), CEASA-RJ (PDF) e CEASA-PR Curitiba (PDF).
      - name: Testes do coletor (amostras reais + iscas)
        run: python tests/test_coletar_precos_ceasas.py

      - name: Coletar preços nas CEASAs (fontes oficiais)
        run: python scripts/coletar_precos_ceasas.py

      - name: Commit do CSV do dia
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add precos_banana_prata_*.csv
          if git diff --cached --quiet; then
            echo "Nada novo para commitar."
          else
            git commit -m "coleta: preços CEASAs oficiais $(date +%F)"
            git pull --rebase origin main
            git push
          fi

      - name: Issue em caso de falha
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXISTE=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "Coleta de preços (CEASAs oficiais) FALHOU" --json number -q 'length')
          if [ "$EXISTE" != "0" ]; then echo "Issue de falha já aberta — não duplicar."; exit 0; fi
          gh issue create -R "$GITHUB_REPOSITORY" \
            --title "Coleta de preços (CEASAs oficiais) FALHOU ($(date +%d/%m/%Y))" \
            --body "$(printf 'A coleta diária de preços falhou. O boletim de segunda AVISA na tela e na voz se ficar sem cotação nova na semana (trava de 09/11/2026), mas não tem preço novo.\n\n**O que fazer (nesta ordem):**\n1. Actions → **collect_prices** → Run workflow (rerodar resolve a maioria).\n2. Se falhar de novo, a fonte pode estar fora do ar — espere 1h e rerode.\n3. Se o log citar GUARDRAIL (preços congelados ou poucas praças), NÃO rerode à força: acione o Claude com o link desta Issue.\n\nLogs: %s/%s/actions/runs/%s' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
