name: IMA-MG — PTVs de banana (embarques)

on:
  schedule:
    - cron: '17 12 * * 1,4'  # segunda e quinta 12:17 UTC = 09:17 BRT (1h antes do boletim de segunda; quinta pega planilhas atrasadas)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    # Teto duro acima do orçamento de 12 min do download: o site do IMA é lento e
    # já deixou um job pendurado por mais de 35 min em 10/08/2026.
    timeout-minutes: 25
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests openpyxl xlrd

      - name: Testes (resiliência de rede — não acessa a internet)
        run: python -m unittest test_coletar_ima_ptv -v

      - name: Coletar planilhas de PTV do IMA-MG
        run: python coletar_ima_ptv.py

      - name: Commitar série atualizada
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ima_ptv_banana_diario.csv ima_ptv_banana_municipios.csv
          if git diff --cached --quiet; then
            echo "Nada novo para commitar."
          else
            git commit -m "Automated update: embarques de banana (PTV IMA-MG)"
            git push
          fi

      - name: Enviar série para o ERP (mercado_precos)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python supabase_upsert.py

      - name: Issue em caso de falha
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create -R "$GITHUB_REPOSITORY" \
            --title "Coleta IMA-MG (embarques) FALHOU ($(date +%d/%m/%Y))" \
            --body "$(printf 'A coleta de PTVs de banana do IMA-MG falhou. O boletim de segunda usa fallback dos últimos 7 dias, então não quebra — mas os dados param de atualizar.\n\n**O que fazer (nesta ordem):**\n1. Actions → **ima_ptv_semanal** → Run workflow (rerodar resolve a maioria).\n2. Se falhar de novo, o site do IMA pode estar fora do ar — espere 1h e rerode.\n3. Persistindo, acione o Claude com o link desta Issue.\n\nLogs: %s/%s/actions/runs/%s' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
