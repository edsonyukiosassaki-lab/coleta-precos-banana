name: IMA-MG — PTVs de banana (embarques)

on:
  schedule:
    - cron: '52 7 * * 1'     # segunda 07:52 UTC = 04:52 BRT — 5 min após collect_prices (mesmo minuto = corrida de git push no mesmo repo); 1h25 antes do boletim (09:17 UTC desde 17/08)
    - cron: '17 12 * * 4'    # quinta 12:17 UTC = 09:17 BRT — pega planilhas atrasadas do IMA
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    # Teto duro acima do pior caso REAL do script: listagem 4×(15s conexão + 90s
    # leitura) + espera ≈ 7,6 min, e o orçamento de 12 min é conferido ANTES de cada
    # download, então o último pode começar em 12:00 e levar mais 3×(15+120)+15 ≈ 7 min.
    # Somando pip install e testes, 25 min matava o job justamente no dia de IMA lento.
    timeout-minutes: 35
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests openpyxl xlrd

      - name: Testes (resiliência de rede — não acessa a internet)
        run: python -m unittest test_coletar_ima_ptv -v

      - name: Coletar planilhas de PTV do IMA-MG
        run: python coletar_ima_ptv.py

      # A coleta funcionou; a fonte é que mudou de forma. Isso é informação, não
      # erro — vira issue para o Edson SABER sem ter que perguntar, e o passo
      # seguinte segue normalmente com o dado que já entrou.
      - name: Avisar se o IMA mudou o formato
        if: hashFiles('mudanca_fonte.txt') != ''
        # avisar é importante, mas NUNCA às custas do dado: se abrir a issue falhar
        # (token, rate limit, issues desabilitadas) o commit adiante tem que acontecer
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create -R "$GITHUB_REPOSITORY" \
            --title "IMA mudou o formato da planilha ($(date +%d/%m/%Y)) — dado entrou normalmente" \
            --body-file mudanca_fonte.txt

      - name: Commitar série atualizada
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # -A com pathspec: o estado da fonte não é escrito quando a planilha mais
          # nova falha, e `git add` num caminho inexistente sai 128 sob `set -e`,
          # descartando os CSVs que as outras 33 planilhas já atualizaram
          git add -A -- ima_ptv_banana_diario.csv ima_ptv_banana_municipios.csv ima_fonte_estado.json
          if git diff --cached --quiet; then
            echo "Nada novo para commitar."
          else
            git commit -m "Automated update: embarques de banana (PTV IMA-MG)"
            git push
          fi

      - name: Enviar série para o ERP (mercado_precos)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python supabase_upsert.py

      - name: Issue em caso de falha
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create -R "$GITHUB_REPOSITORY" \
            --title "Coleta IMA-MG (embarques) FALHOU ($(date +%d/%m/%Y))" \
            --body "$(printf 'A coleta de PTVs de banana do IMA-MG falhou. O boletim de segunda usa fallback dos últimos 7 dias, então não quebra — mas os dados param de atualizar.\n\n**O que fazer (nesta ordem):**\n1. Actions → **ima_ptv_semanal** → Run workflow (rerodar resolve a maioria).\n2. Se falhar de novo, o site do IMA pode estar fora do ar — espere 1h e rerode.\n3. Persistindo, acione o Claude com o link desta Issue.\n\nLogs: %s/%s/actions/runs/%s' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
