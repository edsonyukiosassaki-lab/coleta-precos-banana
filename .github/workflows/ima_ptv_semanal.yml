name: IMA-MG — PTVs de banana (embarques)

on:
  schedule:
    - cron: '17 12 * * 1,4'  # segunda e quinta 12:17 UTC = 09:17 BRT (1h antes do boletim de segunda; quinta pega planilhas atrasadas)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests openpyxl xlrd

      - name: Coletar planilhas de PTV do IMA-MG
        run: python coletar_ima_ptv.py

      - name: Commitar série atualizada
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ima_ptv_banana_diario.csv ima_ptv_banana_municipios.csv
          if git diff --cached --quiet; then
            echo "Nada novo para commitar."
          else
            git commit -m "Automated update: embarques de banana (PTV IMA-MG)"
            git push
          fi
