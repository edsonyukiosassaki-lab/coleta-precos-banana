# TEMPORÁRIO (09/11/2026) — apagar antes de juntar o ramo na main.
# Prova o coletor novo NO EXECUTOR DO GITHUB (fora do Brasil): sites .gov.br às vezes recusam IP de fora,
# e isso não dá para testar do PC. Roda sozinho quando o ramo robo/fontes-oficiais é enviado.
# Só lê e imprime: não grava CSV, não abre issue, não mexe na main.
name: TESTE coletor CEASAs oficiais (temporário)

on:
  push:
    branches: [robo/fontes-oficiais]

permissions:
  contents: read

jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pypdf==6.14.2
      - name: Testes (amostras reais + iscas)
        run: python tests/test_coletar_precos_ceasas.py
      - name: Coleta de hoje, sem gravar
        run: python scripts/coletar_precos_ceasas.py --seco
      - name: Semanas em que o preço ficou parado (Rio e Curitiba, dia a dia)
        run: python scripts/coletar_precos_ceasas.py --de 2026-10-26 --ate 2026-11-09
